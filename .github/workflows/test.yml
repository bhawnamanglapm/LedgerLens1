name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # 35 checks: LLM guardrails, every test statement (rules / mock LLM / deliberately wrong LLM), page order.
      # Uses the offline test double — no API key, no cost.
      - run: npm test
